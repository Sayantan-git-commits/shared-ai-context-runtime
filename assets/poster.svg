<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1400" width="1200" height="1400" style="background:#FAFDFB; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Gradients -->
    <linearGradient id="primaryGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="50%" stop-color="#059669" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>

    <linearGradient id="mintGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6EE7B7" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#10B981" stop-opacity="0.05" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F2FBF6" />
    </linearGradient>

    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ECFDF5" />
      <stop offset="100%" stop-color="#D1FAE5" />
    </linearGradient>

    <linearGradient id="terminalHeader" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#064E3B" />
      <stop offset="100%" stop-color="#065F46" />
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#064E3B" flood-opacity="0.07" />
    </filter>

    <filter id="terminalShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="20" stdDeviation="24" flood-color="#047857" flood-opacity="0.12" />
    </filter>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Pattern -->
  <rect width="1200" height="1400" fill="#FAFDFB" />

  <!-- Subtle Radial Ambient Glows -->
  <circle cx="200" cy="150" r="350" fill="url(#mintGlow)" />
  <circle cx="1050" cy="500" r="400" fill="url(#mintGlow)" />
  <circle cx="600" cy="1200" r="500" fill="url(#mintGlow)" />

  <!-- Top Decorative Tech Border -->
  <rect x="0" y="0" width="1200" height="8" fill="url(#primaryGreen)" />

  <!-- ==================== HEADER ==================== -->
  <g transform="translate(100, 60)">
    <!-- Logo Badge -->
    <rect x="0" y="0" width="64" height="64" rx="18" fill="url(#primaryGreen)" />
    <!-- Lightning bolt / switch symbol -->
    <path d="M34 14 L22 34 L32 34 L30 50 L42 30 L32 30 Z" fill="#FFFFFF" />

    <!-- Brand Name -->
    <text x="82" y="38" font-size="28" font-weight="900" fill="#064E3B" letter-spacing="-0.5">ctx runtime</text>
    <text x="82" y="56" font-size="13" font-weight="600" fill="#059669" letter-spacing="1.5">OPEN-SOURCE CONTEXT ENGINE</text>

    <!-- Version Pill -->
    <rect x="850" y="16" width="150" height="34" rx="17" fill="url(#badgeGrad)" stroke="#A7F3D0" stroke-width="1.5" />
    <circle cx="870" cy="33" r="5" fill="#10B981" />
    <text x="884" y="38" font-size="13" font-weight="700" fill="#065F46">PostgreSQL 17 + MCP</text>
  </g>

  <!-- ==================== HERO HEADLINE ==================== -->
  <g transform="translate(100, 175)">
    <rect x="0" y="0" width="230" height="32" rx="16" fill="#ECFDF5" stroke="#6EE7B7" stroke-width="1" />
    <text x="18" y="21" font-size="13" font-weight="800" fill="#047857" letter-spacing="0.5">⚡ STOP CONTEXT LOSS</text>

    <text x="0" y="90" font-size="54" font-weight="900" fill="#0F172A" line-height="1.15" letter-spacing="-1.5">
      Switch AI Tools.
    </text>
    <text x="0" y="152" font-size="54" font-weight="900" fill="url(#primaryGreen)" letter-spacing="-1.5">
      Never Lose Your Flow.
    </text>

    <text x="0" y="205" font-size="20" font-weight="400" fill="#475569" width="1000">
      A cross-client, cross-device shared context runtime for AI coding agents.
    </text>
    <text x="0" y="235" font-size="20" font-weight="400" fill="#475569">
      Resume verified work in <tspan font-weight="700" fill="#047857">Cursor</tspan>, <tspan font-weight="700" fill="#047857">Claude Code</tspan>, or <tspan font-weight="700" fill="#047857">Antigravity</tspan> with a single command.
    </text>
  </g>

  <!-- ==================== TERMINAL CARD ==================== -->
  <g transform="translate(100, 460)" filter="url(#terminalShadow)">
    <!-- Terminal Container -->
    <rect x="0" y="0" width="1000" height="340" rx="20" fill="#064E3B" />
    <rect x="0" y="0" width="1000" height="340" rx="20" fill="#062F24" opacity="0.96" stroke="#10B981" stroke-width="2" />

    <!-- Terminal Window Header -->
    <rect x="0" y="0" width="1000" height="46" rx="20" fill="url(#terminalHeader)" />
    <!-- Mac Buttons -->
    <circle cx="28" cy="23" r="6" fill="#EF4444" />
    <circle cx="48" cy="23" r="6" fill="#F59E0B" />
    <circle cx="68" cy="23" r="6" fill="#10B981" />
    <text x="440" y="28" font-size="13" font-weight="600" fill="#A7F3D0" letter-spacing="0.5">terminal — ctx continue</text>

    <!-- Code Content -->
    <g transform="translate(36, 85)" font-family="'JetBrains Mono', 'Fira Code', 'Consolas', monospace" font-size="15">
      <!-- Command Prompt -->
      <text x="0" y="0" font-weight="800" fill="#34D399">$ ctx continue</text>

      <!-- Terminal Output -->
      <text x="0" y="32" fill="#6EE7B7">Project:          <tspan fill="#FFFFFF" font-weight="700">shared-auth-service</tspan></text>
      <text x="0" y="60" fill="#6EE7B7">Checkpoint:       <tspan fill="#FFFFFF" font-weight="700">ckpt_045 (version 45)</tspan></text>
      <text x="0" y="88" fill="#6EE7B7">Branch:           <tspan fill="#FFFFFF">feature/auth-refresh</tspan></text>
      <text x="0" y="116" fill="#6EE7B7">Repository state: <tspan fill="#FBBF24">working tree has uncommitted changes (2 files modified)</tspan></text>
      <text x="0" y="144" fill="#6EE7B7">Next action:      <tspan fill="#34D399" font-weight="700">Inspect the failing token rotation test</tspan></text>

      <line x1="0" y1="172" x2="928" y2="172" stroke="#047857" stroke-width="1" stroke-dasharray="6,4" />

      <!-- Token Savings Badge inside Terminal -->
      <text x="0" y="202" fill="#A7F3D0">Context format:   <tspan fill="#34D399" font-weight="800">TOON (Token-Oriented Object Notation)</tspan> — <tspan fill="#6EE7B7" font-weight="700">Saved 15.1% tokens vs JSON</tspan></text>
      <text x="0" y="228" fill="#A7F3D0">Client adapter:   <tspan fill="#FFFFFF">Claude Code (prompt-ready handoff initialized)</tspan></text>
    </g>
  </g>

  <!-- ==================== 4 CORE PILLARS ==================== -->
  <g transform="translate(100, 840)">
    <!-- Feature 1: Immutable Checkpoints -->
    <g transform="translate(0, 0)" filter="url(#cardShadow)">
      <rect x="0" y="0" width="485" height="155" rx="18" fill="url(#cardGrad)" stroke="#D1FAE5" stroke-width="1.5" />
      <rect x="24" y="24" width="48" height="48" rx="14" fill="#ECFDF5" stroke="#10B981" stroke-width="1.5" />
      <!-- Checkpoint Icon -->
      <path d="M48 38 L43 45 L53 45 Z M42 47 H54 V55 H42 Z" fill="#059669" />
      <text x="88" y="44" font-size="19" font-weight="800" fill="#064E3B">Immutable Checkpoints</text>
      <text x="88" y="66" font-size="13" font-weight="600" fill="#059669">PostgreSQL 17 Canonical Store</text>
      <text x="24" y="105" font-size="14" font-weight="400" fill="#475569" width="430">
        Milestones, tasks, and file diffs saved to an immutable, versioned relational state with zero Git pollution.
      </text>
    </g>

    <!-- Feature 2: Git Drift Shield -->
    <g transform="translate(515, 0)" filter="url(#cardShadow)">
      <rect x="0" y="0" width="485" height="155" rx="18" fill="url(#cardGrad)" stroke="#D1FAE5" stroke-width="1.5" />
      <rect x="24" y="24" width="48" height="48" rx="14" fill="#ECFDF5" stroke="#10B981" stroke-width="1.5" />
      <!-- Shield Icon -->
      <path d="M48 36 L38 41 V49 C38 56 48 60 48 60 C48 60 58 56 58 49 V41 Z" fill="#059669" />
      <text x="88" y="44" font-size="19" font-weight="800" fill="#064E3B">Git Drift Detection</text>
      <text x="88" y="66" font-size="13" font-weight="600" fill="#059669">Verify Before Resuming</text>
      <text x="24" y="105" font-size="14" font-weight="400" fill="#475569" width="430">
        Detects uncommitted changes, branch shifts, and HEAD divergence before feeding state to a new agent.
      </text>
    </g>

    <!-- Feature 3: TOON Token Compression -->
    <g transform="translate(0, 180)" filter="url(#cardShadow)">
      <rect x="0" y="0" width="485" height="155" rx="18" fill="url(#cardGrad)" stroke="#D1FAE5" stroke-width="1.5" />
      <rect x="24" y="24" width="48" height="48" rx="14" fill="#ECFDF5" stroke="#10B981" stroke-width="1.5" />
      <!-- Token Icon -->
      <path d="M40 44 L48 38 L56 44 L48 50 Z M40 50 L48 56 L56 50" stroke="#059669" stroke-width="2.5" fill="none" stroke-linejoin="round" />
      <text x="88" y="44" font-size="19" font-weight="800" fill="#064E3B">TOON Token Optimizer</text>
      <text x="88" y="66" font-size="13" font-weight="600" fill="#059669">Save 15%+ Input Tokens</text>
      <text x="24" y="105" font-size="14" font-weight="400" fill="#475569" width="430">
        Dynamic runtime optimization comparing TOON vs minified JSON, preserving strict round-trip accuracy.
      </text>
    </g>

    <!-- Feature 4: Model Context Protocol (MCP) -->
    <g transform="translate(515, 180)" filter="url(#cardShadow)">
      <rect x="0" y="0" width="485" height="155" rx="18" fill="url(#cardGrad)" stroke="#D1FAE5" stroke-width="1.5" />
      <rect x="24" y="24" width="48" height="48" rx="14" fill="#ECFDF5" stroke="#10B981" stroke-width="1.5" />
      <!-- Plug/MCP Icon -->
      <path d="M42 40 V48 M54 40 V48 M38 48 H58 V54 C58 58 48 60 48 60 C48 60 38 58 38 54 Z" stroke="#059669" stroke-width="2" fill="none" />
      <text x="88" y="44" font-size="19" font-weight="800" fill="#064E3B">Model Context Protocol</text>
      <text x="88" y="66" font-size="13" font-weight="600" fill="#059669">7 Native Agent Tools</text>
      <text x="24" y="105" font-size="14" font-weight="400" fill="#475569" width="430">
        Plug directly into Cursor, Claude Desktop, Antigravity, and VS Code for real-time memory tool calls.
      </text>
    </g>
  </g>

  <!-- ==================== BOTTOM FOOTER / CTA ==================== -->
  <g transform="translate(100, 1220)">
    <rect x="0" y="0" width="1000" height="110" rx="20" fill="url(#primaryGreen)" filter="url(#cardShadow)" />
    
    <!-- CTA Text -->
    <text x="40" y="45" font-size="24" font-weight="900" fill="#FFFFFF">Get Started on GitHub</text>
    <text x="40" y="74" font-size="15" font-weight="500" fill="#D1FAE5">
      Open-source, self-hosted, TypeScript monorepo with PostgreSQL backend.
    </text>

    <!-- GitHub Pill Button -->
    <rect x="620" y="30" width="340" height="50" rx="14" fill="#064E3B" />
    <!-- GitHub Logo Mark -->
    <path d="M648 55 C648 49.5 652.5 45 658 45 C663.5 45 668 49.5 668 55 C668 59.4 665.1 63.1 661.2 64.4 C660.7 64.5 660.5 64.2 660.5 63.9 V61.7 C660.5 60.3 659.5 59.5 659.5 59.5 C655.8 59.1 653.2 56.4 653.2 56.4 C652.1 54.5 650.5 54.0 650.5 54.0 C647.5 52.0 650.7 52.0 650.7 52.0 C654.1 52.2 655.9 55.4 655.9 55.4 C658.8 60.4 663.6 59.0 665.5 58.1 C665.8 56.0 666.6 54.5 667.6 53.6 C660.5 52.8 653.0 50.1 653.0 38.0 C653.0 34.5 654.2 31.7 656.3 29.5 C655.9 28.7 654.8 25.4 656.6 21.0 C656.6 21.0 659.3 20.1 665.4 24.3 C668.0 23.5 670.7 23.2 673.5 23.2 C676.2 23.2 679.0 23.5 681.5 24.3 C687.6 20.1 690.3 21.0 690.3 21.0 C692.1 25.4 691.0 28.7 690.7 29.5 C692.8 31.7 693.9 34.5 693.9 38.0 C693.9 50.1 686.4 52.8 679.3 53.6 C680.5 54.7 681.6 56.8 681.6 60.0 V63.9 C681.6 64.2 681.4 64.5 680.9 64.4 C676.9 63.1 674.0 59.4 674.0 55" fill="#FFFFFF" transform="translate(0, 0) scale(0.85)" />
    <text x="695" y="61" font-size="14" font-weight="700" fill="#FFFFFF">github.com/Sayantan-git-commits/...</text>
  </g>
</svg>
