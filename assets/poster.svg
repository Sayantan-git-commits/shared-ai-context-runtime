<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1420" width="1200" height="1420" style="background:#FAFDFB; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Gradients -->
    <linearGradient id="primaryGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="50%" stop-color="#059669" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>

    <linearGradient id="mintGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6EE7B7" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#10B981" stop-opacity="0.05" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F2FBF6" />
    </linearGradient>

    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ECFDF5" />
      <stop offset="100%" stop-color="#D1FAE5" />
    </linearGradient>

    <linearGradient id="terminalHeader" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#064E3B" />
      <stop offset="100%" stop-color="#065F46" />
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#064E3B" flood-opacity="0.06" />
    </filter>

    <filter id="terminalShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="20" stdDeviation="24" flood-color="#047857" flood-opacity="0.12" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="1420" fill="#FAFDFB" />

  <!-- Ambient Radial Glows -->
  <circle cx="200" cy="150" r="350" fill="url(#mintGlow)" />
  <circle cx="1050" cy="500" r="400" fill="url(#mintGlow)" />
  <circle cx="600" cy="1200" r="500" fill="url(#mintGlow)" />

  <!-- Top Accent Bar -->
  <rect x="0" y="0" width="1200" height="8" fill="url(#primaryGreen)" />

  <!-- ==================== HEADER (x: 100 to 1100, width: 1000) ==================== -->
  <g transform="translate(100, 50)">
    <!-- Logo Badge -->
    <rect x="0" y="0" width="60" height="60" rx="16" fill="url(#primaryGreen)" />
    <!-- Lightning Bolt Icon -->
    <path d="M32 13 L21 32 L30 32 L28 47 L39 28 L30 28 Z" fill="#FFFFFF" />

    <!-- Brand Name -->
    <text x="76" y="35" font-size="26" font-weight="900" fill="#064E3B" letter-spacing="-0.5">ctx runtime</text>
    <text x="76" y="53" font-size="12" font-weight="700" fill="#059669" letter-spacing="1.5">OPEN-SOURCE CONTEXT ENGINE</text>

    <!-- Version Pill (Right Aligned inside grid: 810 + 190 = 1000) -->
    <rect x="810" y="13" width="190" height="34" rx="17" fill="url(#badgeGrad)" stroke="#A7F3D0" stroke-width="1.5" />
    <circle cx="828" cy="30" r="5" fill="#10B981" />
    <text x="841" y="35" font-size="13" font-weight="700" fill="#065F46">PostgreSQL 17 + MCP</text>
  </g>

  <!-- ==================== HERO HEADLINE ==================== -->
  <g transform="translate(100, 160)">
    <!-- Tagline Badge -->
    <rect x="0" y="0" width="220" height="30" rx="15" fill="#ECFDF5" stroke="#6EE7B7" stroke-width="1" />
    <text x="16" y="20" font-size="12.5" font-weight="800" fill="#047857" letter-spacing="0.5">⚡ STOP CONTEXT LOSS</text>

    <text x="0" y="82" font-size="52" font-weight="900" fill="#0F172A" letter-spacing="-1.5">
      Switch AI Tools.
    </text>
    <text x="0" y="142" font-size="52" font-weight="900" fill="url(#primaryGreen)" letter-spacing="-1.5">
      Never Lose Your Flow.
    </text>

    <text x="0" y="194" font-size="19" font-weight="400" fill="#475569">
      A cross-client, cross-device shared context runtime for AI coding agents.
    </text>
    <text x="0" y="222" font-size="19" font-weight="400" fill="#475569">
      Resume verified work in <tspan font-weight="700" fill="#047857">Cursor</tspan>, <tspan font-weight="700" fill="#047857">Claude Code</tspan>, or <tspan font-weight="700" fill="#047857">Antigravity</tspan> with a single command.
    </text>
  </g>

  <!-- ==================== TERMINAL CARD (width: 1000) ==================== -->
  <g transform="translate(100, 445)" filter="url(#terminalShadow)">
    <rect x="0" y="0" width="1000" height="340" rx="20" fill="#064E3B" />
    <rect x="0" y="0" width="1000" height="340" rx="20" fill="#062F24" opacity="0.96" stroke="#10B981" stroke-width="2" />

    <!-- Window Header -->
    <rect x="0" y="0" width="1000" height="44" rx="20" fill="url(#terminalHeader)" />
    <!-- Window Controls -->
    <circle cx="28" cy="22" r="6" fill="#EF4444" />
    <circle cx="48" cy="22" r="6" fill="#F59E0B" />
    <circle cx="68" cy="22" r="6" fill="#10B981" />
    <text x="440" y="27" font-size="13" font-weight="600" fill="#A7F3D0" letter-spacing="0.5">terminal — ctx continue</text>

    <!-- Code Content -->
    <g transform="translate(36, 80)" font-family="'JetBrains Mono', 'Fira Code', 'Consolas', monospace" font-size="14.5">
      <!-- Command Prompt -->
      <text x="0" y="0" font-weight="800" fill="#34D399">$ ctx continue</text>

      <!-- Terminal Output -->
      <text x="0" y="32" fill="#6EE7B7">Project:          <tspan fill="#FFFFFF" font-weight="700">shared-auth-service</tspan></text>
      <text x="0" y="60" fill="#6EE7B7">Checkpoint:       <tspan fill="#FFFFFF" font-weight="700">ckpt_045 (version 45)</tspan></text>
      <text x="0" y="88" fill="#6EE7B7">Branch:           <tspan fill="#FFFFFF">feature/auth-refresh</tspan></text>
      <text x="0" y="116" fill="#6EE7B7">Repository state: <tspan fill="#FBBF24">working tree has uncommitted changes (2 files modified)</tspan></text>
      <text x="0" y="144" fill="#6EE7B7">Next action:      <tspan fill="#34D399" font-weight="700">Inspect the failing token rotation test</tspan></text>

      <line x1="0" y1="172" x2="928" y2="172" stroke="#047857" stroke-width="1" stroke-dasharray="6,4" />

      <text x="0" y="202" fill="#A7F3D0">Context format:   <tspan fill="#34D399" font-weight="800">TOON (Token-Oriented Object Notation)</tspan> — <tspan fill="#6EE7B7" font-weight="700">Saved 15.1% tokens vs JSON</tspan></text>
      <text x="0" y="228" fill="#A7F3D0">Client adapter:   <tspan fill="#FFFFFF">Claude Code (prompt-ready handoff initialized)</tspan></text>
    </g>
  </g>

  <!-- ==================== 4 PILLARS GRID (width: 1000) ==================== -->
  <g transform="translate(100, 830)">
    <!-- Feature 1: Immutable Checkpoints -->
    <g transform="translate(0, 0)" filter="url(#cardShadow)">
      <rect x="0" y="0" width="485" height="175" rx="18" fill="url(#cardGrad)" stroke="#D1FAE5" stroke-width="1.5" />
      <rect x="22" y="22" width="46" height="46" rx="12" fill="#ECFDF5" stroke="#10B981" stroke-width="1.5" />
      <path d="M45 36 L40 43 L50 43 Z M39 45 H51 V53 H39 Z" fill="#059669" />
      
      <text x="80" y="42" font-size="18" font-weight="800" fill="#064E3B">Immutable Checkpoints</text>
      <text x="80" y="62" font-size="12.5" font-weight="700" fill="#059669">PostgreSQL 17 Canonical Store</text>
      
      <!-- Multi-line text inside bounds -->
      <text x="22" y="100" font-size="13.5" font-weight="400" fill="#334155">
        <tspan x="22" dy="0">Milestones, tasks, and file diffs saved to an</tspan>
        <tspan x="22" dy="21">immutable, versioned relational state with</tspan>
        <tspan x="22" dy="21">zero Git commit pollution.</tspan>
      </text>
    </g>

    <!-- Feature 2: Git Drift Shield -->
    <g transform="translate(515, 0)" filter="url(#cardShadow)">
      <rect x="0" y="0" width="485" height="175" rx="18" fill="url(#cardGrad)" stroke="#D1FAE5" stroke-width="1.5" />
      <rect x="22" y="22" width="46" height="46" rx="12" fill="#ECFDF5" stroke="#10B981" stroke-width="1.5" />
      <path d="M45 34 L36 39 V47 C36 54 45 58 45 58 C45 58 54 54 54 47 V39 Z" fill="#059669" />
      
      <text x="80" y="42" font-size="18" font-weight="800" fill="#064E3B">Git Drift Detection</text>
      <text x="80" y="62" font-size="12.5" font-weight="700" fill="#059669">Verify Before Resuming</text>
      
      <!-- Multi-line text inside bounds -->
      <text x="22" y="100" font-size="13.5" font-weight="400" fill="#334155">
        <tspan x="22" dy="0">Inspects uncommitted changes, branch</tspan>
        <tspan x="22" dy="21">switches, and HEAD shifts before passing</tspan>
        <tspan x="22" dy="21">project context to a new agent.</tspan>
      </text>
    </g>

    <!-- Feature 3: TOON Token Optimizer -->
    <g transform="translate(0, 195)" filter="url(#cardShadow)">
      <rect x="0" y="0" width="485" height="175" rx="18" fill="url(#cardGrad)" stroke="#D1FAE5" stroke-width="1.5" />
      <rect x="22" y="22" width="46" height="46" rx="12" fill="#ECFDF5" stroke="#10B981" stroke-width="1.5" />
      <path d="M37 42 L45 36 L53 42 L45 48 Z M37 48 L45 54 L53 48" stroke="#059669" stroke-width="2.2" fill="none" stroke-linejoin="round" />
      
      <text x="80" y="42" font-size="18" font-weight="800" fill="#064E3B">TOON Token Optimizer</text>
      <text x="80" y="62" font-size="12.5" font-weight="700" fill="#059669">Save 15%+ Input Tokens</text>
      
      <!-- Multi-line text inside bounds -->
      <text x="22" y="100" font-size="13.5" font-weight="400" fill="#334155">
        <tspan x="22" dy="0">Dynamic runtime optimization comparing</tspan>
        <tspan x="22" dy="21">TOON against minified JSON, preserving</tspan>
        <tspan x="22" dy="21">strict round-trip schema accuracy.</tspan>
      </text>
    </g>

    <!-- Feature 4: Model Context Protocol (MCP) -->
    <g transform="translate(515, 195)" filter="url(#cardShadow)">
      <rect x="0" y="0" width="485" height="175" rx="18" fill="url(#cardGrad)" stroke="#D1FAE5" stroke-width="1.5" />
      <rect x="22" y="22" width="46" height="46" rx="12" fill="#ECFDF5" stroke="#10B981" stroke-width="1.5" />
      <path d="M40 38 V45 M50 38 V45 M36 45 H54 V51 C54 55 45 57 45 57 C45 57 36 55 36 51 Z" stroke="#059669" stroke-width="2" fill="none" />
      
      <text x="80" y="42" font-size="18" font-weight="800" fill="#064E3B">Model Context Protocol</text>
      <text x="80" y="62" font-size="12.5" font-weight="700" fill="#059669">7 Native Agent Tools</text>
      
      <!-- Multi-line text inside bounds -->
      <text x="22" y="100" font-size="13.5" font-weight="400" fill="#334155">
        <tspan x="22" dy="0">Connects directly to Cursor, Claude Code,</tspan>
        <tspan x="22" dy="21">Antigravity, and VS Code for real-time</tspan>
        <tspan x="22" dy="21">memory and checkpoint tool calls.</tspan>
      </text>
    </g>
  </g>

  <!-- ==================== BOTTOM FOOTER / CTA ==================== -->
  <g transform="translate(100, 1245)">
    <rect x="0" y="0" width="1000" height="110" rx="20" fill="url(#primaryGreen)" filter="url(#cardShadow)" />
    
    <text x="40" y="45" font-size="24" font-weight="900" fill="#FFFFFF">Get Started on GitHub</text>
    <text x="40" y="74" font-size="15" font-weight="500" fill="#D1FAE5">
      Open-source, self-hosted, TypeScript monorepo with PostgreSQL backend.
    </text>

    <!-- GitHub Pill Button (width: 350, right aligned inside container) -->
    <rect x="610" y="30" width="350" height="50" rx="14" fill="#064E3B" />
    <!-- GitHub Octocat Mark -->
    <path d="M638 55 C638 49.5 642.5 45 648 45 C653.5 45 658 49.5 658 55 C658 59.4 655.1 63.1 651.2 64.4 C650.7 64.5 650.5 64.2 650.5 63.9 V61.7 C650.5 60.3 649.5 59.5 649.5 59.5 C645.8 59.1 643.2 56.4 643.2 56.4 C642.1 54.5 640.5 54.0 640.5 54.0 C637.5 52.0 640.7 52.0 640.7 52.0 C644.1 52.2 645.9 55.4 645.9 55.4 C648.8 60.4 653.6 59.0 655.5 58.1 C655.8 56.0 656.6 54.5 657.6 53.6 C650.5 52.8 643.0 50.1 643.0 38.0 C643.0 34.5 644.2 31.7 646.3 29.5 C645.9 28.7 644.8 25.4 646.6 21.0 C646.6 21.0 649.3 20.1 655.4 24.3 C658.0 23.5 660.7 23.2 663.5 23.2 C666.2 23.2 669.0 23.5 671.5 24.3 C677.6 20.1 680.3 21.0 680.3 21.0 C682.1 25.4 681.0 28.7 680.7 29.5 C682.8 31.7 683.9 34.5 683.9 38.0 C683.9 50.1 676.4 52.8 669.3 53.6 C670.5 54.7 671.6 56.8 671.6 60.0 V63.9 C671.6 64.2 671.4 64.5 670.9 64.4 C666.9 63.1 664.0 59.4 664.0 55" fill="#FFFFFF" transform="translate(0, 0) scale(0.85)" />
    <text x="682" y="60" font-size="13.5" font-weight="700" fill="#FFFFFF">github.com/Sayantan-git-commits/...</text>
  </g>
</svg>
