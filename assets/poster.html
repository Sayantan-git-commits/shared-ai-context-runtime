<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Shared AI Context Runtime — Promotional Poster</title>
  <style>
    body {
      margin: 0;
      padding: 40px 20px;
      background: #F0FDF4;
      display: flex;
      flex-direction: column;
      align-items: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .poster-container {
      box-shadow: 0 25px 50px -12px rgba(6, 78, 59, 0.25);
      border-radius: 24px;
      overflow: hidden;
      max-width: 900px;
      width: 100%;
      background: #FAFDFB;
    }
    svg {
      width: 100%;
      height: auto;
      display: block;
    }
    .action-bar {
      margin-top: 24px;
      display: flex;
      gap: 16px;
    }
    .btn {
      padding: 12px 24px;
      background: #059669;
      color: white;
      text-decoration: none;
      border-radius: 10px;
      font-weight: 600;
      font-size: 14px;
      transition: background 0.2s;
    }
    .btn:hover {
      background: #047857;
    }
  </style>
</head>
<body>
  <div class="poster-container">
    <object data="poster.svg" type="image/svg+xml" style="width:100%;"></object>
  </div>
  <div class="action-bar">
    <a href="https://github.com/Sayantan-git-commits/shared-ai-context-runtime" class="btn" target="_blank">View on GitHub</a>
  </div>
</body>
</html>
